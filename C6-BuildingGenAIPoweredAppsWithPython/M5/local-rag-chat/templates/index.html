<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local RAG Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        #chatbox { height: 400px; border: 1px solid #ddd; border-radius: 8px; overflow-y: auto; padding: 15px; background: #f9f9f9; margin-bottom: 20px; }
        .user-msg { color: #2c3e50; font-weight: bold; }
        .ai-msg { color: #27ae60; margin-bottom: 15px; }
        input[type="text"] { width: 80%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Local PDF Chat (Llama 3 + Ollama)</h1>
    <p>Upload a PDF and ask questions. Everything stays on your machine.</p>
    
    <input type="file" id="pdfFile" accept=".pdf">
    <button onclick="uploadPDF()">Upload PDF</button>
    <span id="status"></span>

    <hr>

    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Ask a question about the PDF..." onkeypress="if(event.key === 'Enter') sendChat()">
    <button onclick="sendChat()">Send</button>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            if (!fileInput.files[0]) return alert("Select a file first!");
            
            document.getElementById('status').innerText = " Processing...";
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            await fetch('/process-pdf', { method: 'POST', body: formData });
            document.getElementById('status').innerText = " Done!";
        }

        async function sendChat() {
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            if (!input.value) return;

            const userText = input.value;
            chatbox.innerHTML += `<div class="user-msg">You: ${userText}</div>`;
            input.value = '';

            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: userText})
            });
            
            const data = await response.json();
            chatbox.innerHTML += `<div class="ai-msg">Llama3: ${data.answer}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
