<!DOCTYPE html>
<html>
<head>
    <title>Local Babel Fish</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f4; }
        .container { background: white; width: 400px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Babel Fish</h1>
        <button id="recordBtn">Hold to Speak</button>
        <p id="status">Ready</p>
        <div id="result">
            <strong>Translation:</strong> <span id="transText">...</span>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');

        recordBtn.onmousedown = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            status.innerText = "Recording...";
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob, 'rec.wav');

                status.innerText = "Transcribing...";
                // 1. Get Text from Speech
                const sttRes = await fetch('/speech-to-text', { method: 'POST', body: formData });
                const sttData = await sttRes.json();
                
                status.innerText = "Translating...";
                // 2. Get Translation and Audio
                const procRes = await fetch('/process-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userMessage: sttData.text })
                });
                const procData = await procRes.json();

                document.getElementById('transText').innerText = procData.watsonxResponseText;
                status.innerText = "Done!";

                // 3. Play Audio
                const audio = new Audio("data:audio/mp3;base64," + procData.watsonxResponseSpeech);
                audio.play();
            };
        };

        recordBtn.onmouseup = () => {
            mediaRecorder.stop();
        };
    </script>
</body>
</html>
